name: ci
on: { push: { branches: [main], tags: ['v*'] }, pull_request: {}, workflow_dispatch: {} }
jobs:
  # The base install is the contract and carries no dependencies. The first two jobs are separate
  # because one `pip install .` followed by `from prism import Host` tests neither half: it fails on
  # the missing extra and never checks that the contract stands alone. The third runs the suite.
  contract-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install --upgrade pip
      - name: Base install carries no dependencies
        run: |
          pip install .
          pip check
          python - <<'PY'
          import importlib.metadata as md
          own = {"agience-prism", "pip", "setuptools", "wheel"}
          extra = sorted({(d.metadata["Name"] or "").lower() for d in md.distributions()} - own)
          assert not extra, f"base install pulled in dependencies: {extra}"
          print("base install is dependency-free")
          PY
      - name: The contract surface imports
        run: python -c "from prism import Capability, Prism, PRISM_CONTENT_TYPE, AuthError, PrismError, http_status_for; print('contract OK')"
      - name: A runtime name raises, naming its extra
        # The negative control. Without it the step above would still pass on a build where the
        # runtime surfaces had been folded into the base install.
        run: |
          python - <<'PY'
          try:
              from prism import Host
          except ImportError as exc:
              assert "host" in str(exc), exc
              print("runtime surface correctly gated")
          else:
              raise SystemExit("prism.Host imported without the 'host' extra")
          PY

  runtime-surfaces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install --upgrade pip
      - run: pip install '.[all]'
      - run: pip check
      # Called, not just imported. `create_server` reaches its mcp entry point lazily inside the
      # call, so an import-only check passes against an mcp release whose API this code cannot speak.
      - run: |
          python - <<'PY'
          from prism import Host, create_server, Server, TokenVerifier, AuthError
          host = Host("ci-probe")
          assert host.app is not None
          mcp, server = create_server("ci-probe")
          app = server.create_app(mcp)
          assert callable(app)
          print("agience-prism SDK OK — Host and create_server both built")
          PY

  # The suite, on every commit. Installing and importing the package says nothing about whether it
  # behaves: a file deleted from the tree, a README example that no longer runs, and an extra whose
  # entry point has moved all survive an import check.
  #
  # Matrix over the supported range, because `requires-python` claims 3.11 through 3.13 and a claim
  # nothing exercises is a claim that drifts.
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      # `[dev]` is `[all]` plus pytest, pytest-asyncio and ruff. The suite needs every extra: the
      # README blocks build a Host and an MCP server, and the wire tests block numpy and
      # cryptography in a subprocess to prove the base install stands without them.
      - run: pip install '.[dev]'
      - run: pip check
      - name: Lint
        run: python -m ruff check .
      - name: Test suite
        run: python -m pytest -q
