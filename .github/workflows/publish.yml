name: Release

# Cut a release by pushing a version tag. The tag, minus "v", must match `prism.__version__`,
# which is where `pyproject.toml` reads the package version from:
#     git tag v0.1.0 && git push origin v0.1.0
# One job builds, creates the GitHub Release, and publishes to PyPI via Trusted Publishing (OIDC) —
# no token stored. Tests are not re-run here: ci.yml gates every commit on main, and the tag points
# at a tested one.
#
# The distribution is `agience-prism`. Its base install is the contract — stdlib, no dependencies.
# The `trust`, `host`, `server`, `cli`, `vector` and `wire` extras publish in the same wheel and
# sdist and stay dormant until a consumer opts in with `pip install 'agience-prism[...]'`.
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}      # manual dry run: build only (no release/publish)

permissions:
  contents: write            # create the GitHub Release
  id-token: write            # PyPI Trusted Publishing (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi         # must match the PyPI publisher's Environment name
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      # Checked against the built artifact rather than against a file. The version is dynamic —
      # setuptools reads it from `prism.__version__` — so reading a literal out of pyproject.toml
      # would check a key that is no longer there, and reading the source would check the input to
      # the build instead of its output. The wheel that is about to be uploaded is what must carry
      # the tag's version.
      - name: Tag matches the built version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ls -1 dist/
          test -f "dist/agience_prism-${tag}-py3-none-any.whl" || {
            echo "::error::no dist/agience_prism-${tag}-py3-none-any.whl — tag v${tag} does not match prism.__version__"
            exit 1; }
          test -f "dist/agience_prism-${tag}.tar.gz" || {
            echo "::error::no dist/agience_prism-${tag}.tar.gz — tag v${tag} does not match prism.__version__"
            exit 1; }
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/v')
        uses: pypa/gh-action-pypi-publish@release/v1
