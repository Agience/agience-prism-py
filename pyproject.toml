[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agience-bridge"
version = "0.1.0"
description = "Agience Bridge — the developer SDK (Apache-2.0): build a Host (compute serving operators) or an MCP server on Agience, over the wire. No platform IP. Consolidates the former agience-host and the original agience-bridge SDKs; the trust floor moved to agience-core."
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Ikailo Inc." }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "mcp[cli]>=1.6.0",
    "pyjwt[crypto]>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]
